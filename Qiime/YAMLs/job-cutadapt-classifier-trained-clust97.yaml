# job-cutadapt-classifier-trained-clust97.yaml
# This job uses a trained UNITE classifier to assign taxonoy to the sequences
apiVersion: batch/v1
kind: Job
metadata:
  name: classifier-job
  namespace: grad-erth-wmis-kranderson4
spec:
  backoffLimit: 4
#  parallelism: 1
  template:
    spec:
      containers:
      - name: classifier-job-pod
        image: quay.io/qiime2/qiime2-workshop:2026.10   # Verify this is the correct version for the classifier job
        command:
        - /bin/sh
        - -c
        - 'cd /biovol && echo "**Assigning taxonomy on $(date)...**" && qiime feature-classifier classify-sklearn --i-classifier classifier_97.qza --i-reads cutadapt/seqs_otus97_sgl.qza --o-classification cutadapt/taxa_otus97_trained.qza && echo "**Taxonomy assigned on $(date). Visualizing taxonomy...**" && qiime feature-table tabulate-seqs --i-data cutadapt/seqs_otus97_sgl.qza --i-taxonomy cutadapt/taxa_otus97_trained.qza --m-metadata-file cutadapt/feat_freq_otus97_sgl.qza --o-visualization cutadapt/taxa_otus97_trained.qzv && echo "**Visualization complete on $(date). Creating barplot...**" && qiime taxa barplot --i-table cutadapt/table_otus97_sgl.qza --i-taxonomy cutadapt/taxa_otus97_trained.qza --m-metadata-file metadata.tsv --o-visualization cutadapt/barplot_taxa_otus97_trained.qzv && echo "**Barplot complete on $(date).**"'
        resources:
          limits:
            memory: 256Gi
            cpu: 8
          requests:
            memory: 256Gi
            cpu: 8
        volumeMounts:
        - mountPath: /biovol
          name: biovol
      volumes:
      - name: biovol
        persistentVolumeClaim:
          claimName: rxfungi-vol
      restartPolicy: Never