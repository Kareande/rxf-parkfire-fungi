# job-classifier-training-clust.yaml
# This job trains a UNITE classifier
apiVersion: batch/v1
kind: Job
metadata:
  name: classifier-job
  namespace: grad-erth-wmis-kranderson4
spec:
  backoffLimit: 4
#  parallelism: 1
  template:
    spec:
      containers:
      - name: classifier-job-pod
        image: quay.io/qiime2/qiime2:2026.4   # Verify this is the correct version for the classifier job
        command:
        - /bin/sh
        - -c
        - 'cd /biovol && echo "**Training classifier on $(date)...**" && qiime feature-classifier fit-classifier-naive-bayes --i-reference-reads unite_97.qza --i-reference-taxonomy unite_taxonomy_97.qza --o-classifier classifier_97.qza && echo "**Classifier trained on $(date)...**"'
        resources:
          limits:
            memory: 256Gi
            cpu: 8
          requests:
            memory: 256Gi
            cpu: 8
        volumeMounts:
        - mountPath: /biovol
          name: biovol
      volumes:
      - name: biovol
        persistentVolumeClaim:
          claimName: rxfungi-vol
      restartPolicy: Never