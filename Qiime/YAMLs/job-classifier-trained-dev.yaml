# job-classifier-trained-dev.yaml
# This job uses a trained UNITE classifier to assign taxonoy to the sequences
apiVersion: batch/v1
kind: Job
metadata:
  name: classifier-job
  namespace: grad-erth-wmis-kranderson4
spec:
  backoffLimit: 4
#  parallelism: 1
  template:
    spec:
      containers:
      - name: classifier-job-pod
        image: quay.io/qiime2/qiime2:2026.4   # Verify this is the correct version for the classifier job
        command:
        - /bin/sh
        - -c
        - 'cd /biovol && echo "**Assigning taxonomy on $(date)...**" && qiime feature-classifier classify-sklearn --i-classifier classifier_dev.qza --i-reads seqs_demux.qza --o-classification taxa_demux_trained.qza && echo "**Taxonomy assigned on $(date). Visualizing taxonomy...**" && qiime feature-table tabulate-seqs --i-data seqs_demux.qza --i-taxonomy unite_taxonomy_dev.qza --m-metadata-file demux_summary_export/per-sample-fastq-counts.tsv --o-visualization taxa_demux_trained.qzv && echo "**Visualization complete on $(date).**"'
        resources:
          limits:
            memory: 256Gi
            cpu: 8
          requests:
            memory: 256Gi
            cpu: 8
        volumeMounts:
        - mountPath: /biovol
          name: biovol
      volumes:
      - name: biovol
        persistentVolumeClaim:
          claimName: rxfungi-vol
      restartPolicy: Never